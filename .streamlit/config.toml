# Setelan bawaan Streamlit untuk Tax Dispute Analytic Dashboard.
#
# Warna utama diganti dari merah bawaan menjadi biru merek. Merah bawaan
# muncul pada penggeser, kotak centang, dan tautan, dan warna itu sudah
# dipesan sebagai warna status genting sehingga tidak boleh dipakai sebagai
# warna antarmuka biasa.

[theme]
primaryColor = "#2f6cc0"
font = "sans serif"

[theme.light]
backgroundColor = "#eef1f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"

[theme.dark]
backgroundColor = "#12141a"
secondaryBackgroundColor = "#1c1f26"
textColor = "#ffffff"

[server]
headless = true

[browser]
gatherUsageStats = false

# Bilah alat bawaan dijadikan seminimal mungkin.
#
# Pada aplikasi yang diterbitkan di Streamlit Cloud, bilah alat bawaan memuat
# tombol Fork beserta pranala menuju repositori GitHub pemilik aplikasi.
# Keduanya berbahaya untuk dashboard yang dibuka pemakai luar: tombol Fork
# memungkinkan siapa pun menyalin seluruh aplikasi ke akunnya sendiri, dan
# pranala di sebelahnya membawa pemakai langsung ke repositori pemiliknya.
# Tidak satu pun dari keduanya berguna bagi pembaca dashboard ini.
#
# Setelan viewer menyembunyikan seluruh pilihan pengembang, dan hanya
# menyisakan yang benar benar diperlukan pembaca biasa. Ini penanganan di
# sumbernya. Penanganan lapis kedua dipasang pada gaya halaman, karena
# setelan ini ditafsirkan peladen Streamlit Cloud dan tidak boleh menjadi
# satu satunya pengaman.
[client]
toolbarMode = "viewer"
